name: ARM64 REV16 emulator regression

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-arm64-rev16
    paths:
      - .github/workflows/arm64-rev16-regression.yml
      - asbestos/**
      - emu/**
      - kernel/**
      - fs/**
      - platform/**
      - util/**
      - vdso/arm64/**
      - meson.build
      - meson_options.txt
      - xX_main_Xx.h
      - tests/manual/arm64-rev16.S
      - tests/manual/arm64-rev16.sh

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Pin the failing parent so later CI-only commits still reproduce the bug.
      BASELINE_REVISION: 2ede58913b56a899945752d3002a9c068666e52c
      CC: clang
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the fix
        uses: actions/checkout@v4

      - name: Install native Apple Silicon build dependencies
        run: |
          set -euxo pipefail
          test "$(uname -m)" = arm64
          brew install ninja lld llvm meson coreutils

      - name: Prepare the failing parent and a shared guest test
        run: |
          set -euxo pipefail
          mkdir -p artifacts guest-root/dev/pts guest-root/proc
          git fetch --no-tags --depth=1 origin "$BASELINE_REVISION"
          git worktree add --detach "$RUNNER_TEMP/rev16-parent" "$BASELINE_REVISION"
          git rev-parse HEAD > artifacts/fixed-revision.txt
          git -C "$RUNNER_TEMP/rev16-parent" rev-parse HEAD > artifacts/parent-revision.txt
          sh tests/manual/arm64-rev16.sh "$GITHUB_WORKSPACE/guest-root/arm64-rev16"
          sha256sum guest-root/arm64-rev16 > artifacts/guest-sha256.txt
          printf 'REV16 vector: 4 cases passed\n' > artifacts/expected.txt

      - name: Build both versions of the actual iSH emulator
        id: build
        run: |
          set -euxo pipefail
          # Use the repository's normal macOS CLI, including its real guest
          # loader, kernel, decoder and ARM64 gadgets. main.c routes kernel log
          # fd 666 to stderr. Neither source tree receives compatibility patches.
          build_emulator() {
            local source_dir="$1" build_dir="$2"
            meson setup "$build_dir" "$source_dir" \
              -Dguest_arch=arm64 -Dengine=asbestos -Dkernel=ish \
              -Dc_args=-Dposix_spawn_file_actions_addchdir=posix_spawn_file_actions_addchdir_np \
              -Dlog_handler=dprintf -Dno_crlf=true --buildtype=release
            ninja -C "$build_dir" ish
          }
          build_emulator "$RUNNER_TEMP/rev16-parent" "$RUNNER_TEMP/rev16-parent-build"
          build_emulator "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-rev16"

      - name: Confirm the parent rejects REV16 inside iSH
        run: |
          set -euo pipefail
          set +e
          gtimeout 30s "$RUNNER_TEMP/rev16-parent-build/ish" \
            -r "$GITHUB_WORKSPACE/guest-root" /arm64-rev16 \
            > artifacts/parent.stdout 2> artifacts/parent.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/parent.exit-status
          cat artifacts/parent.stdout artifacts/parent.stderr
          printf 'Parent host exit status: %s\n' "$status"
          # This guest runs as PID 1. kernel/exit.c calls halt_system(), which
          # exits the host with 0 before the CLI exit hook can map SIGILL to
          # 132. Require the precise missing instruction and no PASS output;
          # host status alone cannot distinguish a guest crash from success.
          test "$status" -eq 0
          test ! -s artifacts/parent.stdout
          grep -Eq 'illegal instruction at 0x[0-9a-f]+: insn=0x0e201821' artifacts/parent.stderr
          echo 'Pinned parent reproduces the precise guest REV16 SIGILL.'

      - name: Confirm all four REV16 cases pass inside fixed iSH
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          gtimeout 30s "$GITHUB_WORKSPACE/build-rev16/ish" \
            -r "$GITHUB_WORKSPACE/guest-root" /arm64-rev16 \
            > artifacts/fixed.stdout 2> artifacts/fixed.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/fixed.exit-status
          cat artifacts/fixed.stdout artifacts/fixed.stderr
          printf 'Fixed host exit status: %s\n' "$status"
          test "$status" -eq 0
          diff -u artifacts/expected.txt artifacts/fixed.stdout
          ! grep -q 'illegal instruction' artifacts/fixed.stderr
          echo 'Fixed emulator passes the same guest binary.'

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-rev16-regression
          path: |
            artifacts/
            guest-root/arm64-rev16
            build-rev16/meson-logs/
            ${{ runner.temp }}/rev16-parent-build/meson-logs/
          if-no-files-found: warn
          retention-days: 14
