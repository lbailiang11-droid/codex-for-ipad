name: ARM64 pinned Codex smoke

on:
  workflow_dispatch:
  push:
    branches:
      - exp/codexpad-on-arm64
      - codex/fix-arm64-rev16
    paths:
      - .github/workflows/arm64-pinned-codex-smoke.yml
      - patches/codex-arm64-musl.patch
      - patches/codex-rustls-provider-compat.patch
      - patches/codex-token-exchange-diagnostics.patch
      - patches/codex-ish-parent-death-signal.patch
      - compat/codex-arm64/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-codex:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    env:
      CODEX_REVISION: 6bd3f5e3db8275c10c7e4bbcc1342c32a89b7eee
      RUST_TOOLCHAIN: 1.95.0
      CODEX_TARGET: aarch64-unknown-linux-musl
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target
      CARGO_HOME: ${{ github.workspace }}/.codex-local/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.codex-local/rustup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch pinned Codex
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p upstream/codex
          git -C upstream/codex init
          git -C upstream/codex remote add origin https://github.com/openai/codex.git
          git -C upstream/codex fetch --depth=1 origin "$CODEX_REVISION"
          git -C upstream/codex checkout --detach FETCH_HEAD
          test "$(git -C upstream/codex rev-parse HEAD)" = "$CODEX_REVISION"

      - name: Apply ARM64 musl compatibility
        shell: bash
        run: |
          set -euxo pipefail

          test -f upstream/codex/codex-rs/code-mode/Cargo.toml
          test -f upstream/codex/codex-rs/code-mode/src/lib.rs

          git -C upstream/codex apply --check "$GITHUB_WORKSPACE/patches/codex-arm64-musl.patch"
          git -C upstream/codex apply "$GITHUB_WORKSPACE/patches/codex-arm64-musl.patch"

          install -m 0644 \
            "$GITHUB_WORKSPACE/compat/codex-arm64/code-mode/service_unavailable.rs" \
            upstream/codex/codex-rs/code-mode/src/service_unavailable.rs

          install -m 0644 \
            "$GITHUB_WORKSPACE/compat/codex-arm64/code-mode/v8_init_unavailable.rs" \
            upstream/codex/codex-rs/code-mode/src/v8_init_unavailable.rs

          test -s upstream/codex/codex-rs/code-mode/src/service_unavailable.rs
          test -s upstream/codex/codex-rs/code-mode/src/v8_init_unavailable.rs

          git -C upstream/codex apply --check "$GITHUB_WORKSPACE/patches/codex-rustls-provider-compat.patch"
          git -C upstream/codex apply "$GITHUB_WORKSPACE/patches/codex-rustls-provider-compat.patch"
          git -C upstream/codex apply --check "$GITHUB_WORKSPACE/patches/codex-token-exchange-diagnostics.patch"
          git -C upstream/codex apply "$GITHUB_WORKSPACE/patches/codex-token-exchange-diagnostics.patch"
          git -C upstream/codex apply --check "$GITHUB_WORKSPACE/patches/codex-ish-parent-death-signal.patch"
          git -C upstream/codex apply "$GITHUB_WORKSPACE/patches/codex-ish-parent-death-signal.patch"

          git -C upstream/codex diff --check
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --target "$CODEX_TARGET"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Test native rustls provider installation and preservation
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: cargo test --locked -p codex-utils-rustls-provider --tests

      - name: Test native pipe execution and process cleanup
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: cargo test --locked -p codex-utils-pty --lib pipe_

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        shell: bash
        run: cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Build ARM64 TLS probe with a fixed fake authorization code
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: |
          # Standalone http-client lacks the full app-server graph's vendored OpenSSL feature.
          cargo zigbuild --locked --release --target "$CODEX_TARGET" \
            -p codex-http-client --bin custom_ca_probe --features reqwest/native-tls-vendored

      - name: Package TLS probe before the full app-server build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/probe
          install -m 0755 "$CARGO_TARGET_DIR/$CODEX_TARGET/release/custom_ca_probe" artifacts/probe/custom_ca_probe
          strip --strip-all artifacts/probe/custom_ca_probe
          artifacts/probe/custom_ca_probe
          printf 'Codex source: %s\nCodexPad build: %s\nTarget: %s\n' \
            "$CODEX_REVISION" "$GITHUB_SHA" "$CODEX_TARGET" > artifacts/probe/BUILD.txt
          (cd artifacts/probe && sha256sum custom_ca_probe > SHA256SUMS)
          tar -C artifacts/probe -czf "$GITHUB_WORKSPACE/artifacts/codex-custom-ca-probe-aarch64-musl.tar.gz" \
            custom_ca_probe BUILD.txt SHA256SUMS

      - name: Upload TLS probe for early iPad diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: codex-custom-ca-probe-aarch64-musl
          path: artifacts/codex-custom-ca-probe-aarch64-musl.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Build pinned ARM64 app-server
        id: build
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: |
          set -euxo pipefail
          cargo zigbuild --locked --release --target "$CODEX_TARGET" -p codex-app-server --bin codex-app-server

      - name: Run pinned ARM64 app-server
        shell: bash
        run: |
          set -euxo pipefail
          binary="$CARGO_TARGET_DIR/$CODEX_TARGET/release/codex-app-server"
          file "$binary"
          readelf -h "$binary" | grep -q 'Machine:.*AArch64'
          "$binary" --version
          "$binary" --help > /tmp/help.txt
          "$binary" --listen ws://127.0.0.1:4500 > /tmp/server.out 2> /tmp/server.err &
          pid=$!
          sleep 3
          cat /tmp/server.err || true
          kill -0 "$pid"
          ss -ltn | grep -q ':4500'
          kill "$pid"
          wait "$pid" || true
      - name: Package ARM64 app-server
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/package
          install -m 0755 "$CARGO_TARGET_DIR/$CODEX_TARGET/release/codex-app-server" artifacts/package/codex-app-server
          install -m 0755 "$CARGO_TARGET_DIR/$CODEX_TARGET/release/custom_ca_probe" artifacts/package/custom_ca_probe
          # Strip only the installable copy; retain the original ELF for symbolication.
          strip --strip-all artifacts/package/codex-app-server artifacts/package/custom_ca_probe
          artifacts/package/codex-app-server --version
          # Without CODEX_CUSTOM_CA_PROBE_URL this only constructs the TLS client.
          artifacts/package/custom_ca_probe
          file artifacts/package/codex-app-server artifacts/package/custom_ca_probe
          printf 'Codex source: %s\nCodexPad build: %s\nTarget: %s\n' \
            "$CODEX_REVISION" "$GITHUB_SHA" "$CODEX_TARGET" > artifacts/package/BUILD.txt
          sha256sum patches/codex-*.patch >> artifacts/package/BUILD.txt
          (cd artifacts/package && sha256sum codex-app-server custom_ca_probe > SHA256SUMS)
          tar -C artifacts/package -czf "$GITHUB_WORKSPACE/artifacts/codex-app-server-aarch64-musl.tar.gz" \
            codex-app-server custom_ca_probe BUILD.txt SHA256SUMS

      - name: Upload ARM64 app-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-aarch64-musl
          path: artifacts/codex-app-server-aarch64-musl.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload unstripped ARM64 app-server for diagnosis
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-aarch64-musl-debug
          path: |
            artifacts/cargo-target/aarch64-unknown-linux-musl/release/codex-app-server
            artifacts/cargo-target/aarch64-unknown-linux-musl/release/custom_ca_probe
          if-no-files-found: error
          retention-days: 7
